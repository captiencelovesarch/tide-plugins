three editors in tide's settings. the theme editor changes the active theme's colours, type and corners while you watch, and saves the result as a theme of your own. the glyph editor swaps any control's glyph for one to three characters of yours. the keymap editor rebinds every shortcut.

what you make keeps working without the plugin: uninstall it and your themes, glyphs and keys stay.
"""
